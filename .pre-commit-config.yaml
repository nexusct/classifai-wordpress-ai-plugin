# ==========================================================================
# Nexus Communications Technology - Pre-commit Security Hooks
# Last updated: 2026-04-19 after credential exposure incident
# ==========================================================================
# SETUP (once per machine):
#   pip install pre-commit
#
# SETUP (once per repo):
#   cp .pre-commit-config.yaml <repo>/
#   cd <repo>
#   pre-commit install
#
# Manual scan (before important pushes):
#   pre-commit run --all-files
# ==========================================================================

repos:
  # ---- Secret detection ----
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets (belt + suspenders)
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock\.json|yarn\.lock|pnpm-lock\.yaml

  # ---- Nexus-specific forbidden strings ----
  - repo: local
    hooks:
      - id: nexus-forbidden-patterns
        name: Block Nexus-known-bad patterns
        entry: |
          bash -c '
          FAIL=0
          # Known-bad admin password from the 2026-04-19 incident
          if git diff --cached | grep -qE "nexus2026"; then
            echo "❌ BLOCKED: commit contains the string \"nexus2026\" (retired admin password)."
            FAIL=1
          fi
          # Dealer cost marker (pricing-engine.js dealer data)
          if git diff --cached | grep -qE "const MARGIN = 0\.25"; then
            echo "❌ BLOCKED: commit contains internal margin constant. Use NexusPricing.init()."
            FAIL=1
          fi
          # Google Maps API key pattern (any AIza... key that is NOT in a .example.* file)
          if git diff --cached --name-only | grep -vE "\.(example|template)\." | \
             xargs -I{} git diff --cached -- {} 2>/dev/null | grep -qE "AIza[0-9A-Za-z_-]{35}"; then
            echo "❌ BLOCKED: commit contains a Google API key. Move to env var / config.local.js."
            FAIL=1
          fi
          # AWS access keys
          if git diff --cached | grep -qE "AKIA[0-9A-Z]{16}"; then
            echo "❌ BLOCKED: commit contains AWS access key."
            FAIL=1
          fi
          # Private keys
          if git diff --cached | grep -qE "BEGIN (RSA |OPENSSH |EC |DSA |PGP )?PRIVATE KEY"; then
            echo "❌ BLOCKED: commit contains a private key."
            FAIL=1
          fi
          exit $FAIL
          '
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ---- WordPress security checks ----
  - repo: local
    hooks:
      - id: wordpress-security-checks
        name: Check WordPress security best practices
        entry: |
          bash -c '
          FAIL=0
          # Check for direct database queries without prepare()
          if git diff --cached --name-only | grep "\.php$" | \
             xargs -I{} git diff --cached -- {} 2>/dev/null | \
             grep -E "(\$wpdb->query|\$wpdb->get_|SELECT|UPDATE|DELETE|INSERT).*\\\$" | \
             grep -vE "(prepare|esc_sql)"; then
            echo "⚠️  WARNING: Potential SQL injection. Use \$wpdb->prepare() for queries with variables."
            FAIL=1
          fi
          # Check for missing nonce verification in POST/GET handlers
          if git diff --cached --name-only | grep "\.php$" | \
             xargs -I{} git diff --cached -- {} 2>/dev/null | \
             grep -E "(\\\$_POST|\\\$_GET)" | head -5 | grep -v "wp_verify_nonce"; then
            echo "⚠️  WARNING: Found \$_POST/\$_GET without visible nonce verification."
            echo "    Ensure wp_verify_nonce() is used for form submissions."
          fi
          # Check for eval() usage
          if git diff --cached --name-only | grep "\.php$" | \
             xargs -I{} git diff --cached -- {} 2>/dev/null | grep -E "eval\("; then
            echo "❌ BLOCKED: eval() is dangerous and banned in WordPress plugins."
            FAIL=1
          fi
          # Check for direct echo of user input without escaping
          if git diff --cached --name-only | grep "\.php$" | \
             xargs -I{} git diff --cached -- {} 2>/dev/null | \
             grep -E "echo.*\\\$_(POST|GET|REQUEST)" | grep -vE "(esc_html|esc_attr|esc_url)"; then
            echo "❌ BLOCKED: Potential XSS. Use esc_html(), esc_attr(), or esc_url() for output."
            FAIL=1
          fi
          exit $FAIL
          '
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ---- File hygiene ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
      - id: mixed-line-ending
